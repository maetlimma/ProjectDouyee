# Render Blueprint: one free web service and one free PostgreSQL database.
# Free Render Postgres expires 30 days after creation; upgrade or migrate the data before then.
services:
  - type: web
    name: douyee
    runtime: docker
    plan: free
    region: singapore
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: douyee-db
          property: connectionString
      # Used once to create the first admin when the admin_user table is empty.
      - key: ADMIN_EMAIL
        sync: false
      - key: ADMIN_PASSWORD
        sync: false

databases:
  - name: douyee-db
    plan: free
    region: singapore
    databaseName: douyee
    user: douyee
