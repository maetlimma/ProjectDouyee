services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-douyee}
      POSTGRES_USER: ${POSTGRES_USER:-douyee}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-douyee}
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    volumes:
      - douyee-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-douyee} -d ${POSTGRES_DB:-douyee}"]
      interval: 5s
      timeout: 3s
      retries: 20

volumes:
  douyee-postgres:
